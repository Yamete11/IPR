spring:
  application:
    name: anomaly-detector-service

  # TimescaleDB (metrics), read-only for this service. Same instance ingestion-service writes to;
  # TIMESCALE_PORT matches the host port docker-compose.yml publishes. No AGE init-sql here.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${TIMESCALE_PORT:5433}/${POSTGRES_DB:smartcity}
    username: ${POSTGRES_USER:smartcity}
    password: ${POSTGRES_PASSWORD:smartcity}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: anomaly-detector-pool
      maximum-pool-size: 5

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

# Detector tuning.
anomaly:
  # How often the detection loop polls the continuous aggregate.
  poll-interval-ms: ${ANOMALY_POLL_INTERVAL_MS:15000}
  # How far back to look for each series' latest 5-minute window.
  lookback: ${ANOMALY_LOOKBACK:15m}
  schema:
    # Create the metrics_5m_avg continuous aggregate + refresh policy on startup (off in tests).
    init-enabled: ${ANOMALY_SCHEMA_INIT_ENABLED:true}
  # Threshold rules, one per monitored metric_type (see detection/ThresholdRuleRegistry). Each rule
  # reads a boundary aggregate (MIN/MAX) of the latest 5-minute window and fires when it is
  # BELOW/ABOVE the threshold. The alert's `rule` label is derived as
  # <metric>_<min|max><op><threshold>, e.g. pipe_pressure_min<0.5. Thresholds sit just outside the
  # simulator's healthy band so an injected fault (pressure 0, temperature 130, voltage 0) trips.
  rules:
    - metric-type: pipe_pressure
      aggregate: MIN
      comparison: BELOW
      threshold: 0.5
    - metric-type: cable_temperature
      aggregate: MAX
      comparison: ABOVE
      threshold: 120
    - metric-type: substation_voltage
      aggregate: MIN
      comparison: BELOW
      threshold: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
