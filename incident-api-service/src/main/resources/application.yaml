spring:
  application:
    name: incident-api-service

  # TimescaleDB — the single datasource. Reads the incidents table (written by
  # ai-incident-responder) and the metrics hypertable (written by ingestion); owns neither, so there
  # is no spring.sql.init here. TIMESCALE_PORT matches the host port docker-compose.yml publishes.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${TIMESCALE_PORT:5433}/${POSTGRES_DB:smartcity}
    username: ${POSTGRES_USER:smartcity}
    password: ${POSTGRES_PASSWORD:smartcity}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: incident-api-pool
      maximum-pool-size: 10

server:
  # Distinct from topology-service (8080) so both GraphQL services can run locally at once.
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

---
# Dev-only: expose the interactive GraphiQL console and the schema printer endpoint.
# Gated behind the `dev` profile so they are never enabled in other environments.
spring:
  config:
    activate:
      on-profile: dev
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true
