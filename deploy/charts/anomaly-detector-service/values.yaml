# Image built by deploy/scripts/build-images.* and loaded into the Kind cluster.
image:
  repository: smartcity/anomaly-detector-service
  tag: dev
  pullPolicy: IfNotPresent
# The umbrella chart sets global.imageTag once for every service; leave empty when standalone.
global:
  imageTag: ""

replicaCount: 1
containerPort: 8080
service:
  port: 8080

# Broker/database addresses come from the shared ConfigMap, credentials from Secrets (both created
# by the smartcity-infra chart).
configMapName: smartcity-config
secretRefs:
  - name: postgres-credentials

# Extra environment variables for this container.
env: []

# Init containers that block until a dependency accepts TCP connections.
waitImage: busybox:1.37
waitFor:
  - name: timescaledb
    host: timescaledb
    port: 5432
  - name: kafka
    host: smartcity-kafka-bootstrap
    port: 9092

# The detector's continuous aggregate is built FROM the metrics hypertable, which ingestion-service
# creates on its own startup. Besides the in-app wait (anomaly.schema.wait-timeout) this init
# container holds the pod until the hypertable exists, so a fresh cluster never crash-loops here.
extraInitContainers:
  - name: wait-for-hypertable
    image: postgres:16-alpine
    envFrom:
      - configMapRef:
          name: smartcity-config
      - secretRef:
          name: postgres-credentials
    command:
      - sh
      - -c
      - >-
        until psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$TIMESCALE_HOST:$TIMESCALE_PORT/$POSTGRES_DB"
        -tAc "SELECT 1 FROM timescaledb_information.hypertables WHERE hypertable_name='metrics'" | grep -q 1;
        do echo "waiting for the metrics hypertable (ingestion-service creates it)"; sleep 5; done

probes:
  # JVM start + schema init can take a while on a cold Kind node: 30 x 5 s before liveness kicks in.
  startupFailureThreshold: 30

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
