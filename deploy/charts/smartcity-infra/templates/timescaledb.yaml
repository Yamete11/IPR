# timescaledb: PostgreSQL 16 + TimescaleDB — the metrics hypertable (ingestion-service), the
# 5-minute continuous aggregate (anomaly-detector) and the incidents table (ai-incident-responder).
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  labels:
    app: timescaledb
    app.kubernetes.io/part-of: smartcity
spec:
  type: ClusterIP
  selector:
    app: timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  labels:
    app: timescaledb
    app.kubernetes.io/part-of: smartcity
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: postgres
          # The image sets shared_preload_libraries=timescaledb and creates the extension on first boot.
          image: {{ .Values.timescaledb.image }}
          # timescaledb-tune sizes max_connections from the memory limit on first boot (25 at 2Gi), too
          # few once ingestion-service scales out (pool of 10 per replica, up to 6 replicas under KEDA).
          # Command-line settings override the tuned postgresql.conf, also on an existing volume.
          args: ["postgres", "-c", "max_connections={{ .Values.timescaledb.maxConnections }}"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.timescaledb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.timescaledb.storage }}
