# age-db: PostgreSQL 16 + Apache AGE, the topology graph (written only by topology-service).
apiVersion: v1
kind: Service
metadata:
  name: age-db
  labels:
    app: age-db
    app.kubernetes.io/part-of: smartcity
spec:
  type: ClusterIP
  selector:
    app: age-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: age-db
  labels:
    app: age-db
    app.kubernetes.io/part-of: smartcity
spec:
  serviceName: age-db
  replicas: 1
  selector:
    matchLabels:
      app: age-db
  template:
    metadata:
      labels:
        app: age-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.ageDb.image }}
          # Preload AGE so every session can use the graph without an explicit LOAD 'age'.
          args: ["postgres", "-c", "shared_preload_libraries=age"]
          env:
            # A subdirectory of the mount: Postgres refuses a data directory that is a mount point.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smartcity-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.ageDb.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: age-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.ageDb.storage }}
