# Non-secret settings every service reads through envFrom (ConfigMap `smartcity-config`). The
# names match the placeholders in each service's application.yaml. Both databases listen on 5432
# inside the cluster (the 5433 in docker-compose.yml is only a host-port trick).
config:
  KAFKA_BOOTSTRAP: smartcity-kafka-bootstrap:9092
  AGE_HOST: age-db
  AGE_PORT: "5432"
  TIMESCALE_HOST: timescaledb
  TIMESCALE_PORT: "5432"
  # Fallback for anything still reading the single-host name.
  POSTGRES_HOST: timescaledb
  POSTGRES_DB: smartcity
  # Offline planner by default; flip to "false" (and provide anthropic.apiKey) for real Claude calls.
  AI_CLAUDE_MOCK: "true"
  AI_CLAUDE_MODEL: claude-opus-5-5
  # A cold cluster can take a while before ingestion-service has created the hypertable.
  ANOMALY_SCHEMA_WAIT_TIMEOUT: 15m

# Secret `postgres-credentials`, shared by both StatefulSets and every service.
postgres:
  user: smartcity
  password: smartcity

# Secret `anthropic` is created only when a key is given (deploy/scripts/up.* reads it from .env).
anthropic:
  apiKey: ""

# Storage for the two StatefulSets' PVCs. The field is left out of volumeClaimTemplates when
# className is empty, so the cluster default (Kind: `standard`, local-path, reclaimPolicy Delete)
# provisions them. volumeClaimTemplates are immutable: changing className on an existing release
# needs `kubectl delete statefulset --cascade=orphan` (PVCs stay) or a fresh cluster.
storage:
  className: ""
  # Create a StorageClass of our own. Point className at it to use it, e.g.
  #   --set storage.createClass=true --set storage.className=smartcity-retain
  createClass: false
  class:
    name: smartcity-retain
    provisioner: rancher.io/local-path
    # Retain keeps the PV (and its data on the node) after the PVC is deleted.
    reclaimPolicy: Retain
    # Delay binding until a pod is scheduled, so the volume lands on that pod's node.
    volumeBindingMode: WaitForFirstConsumer
  # Static provisioning demo: a hand-made hostPath PV and a PVC bound to it by name, no
  # provisioner involved. Nothing mounts it; `kubectl get pv,pvc` shows the binding.
  staticPvDemo:
    enabled: false
    size: 1Gi
    hostPath: /tmp/smartcity-static-pv

ageDb:
  image: apache/age:release_PG16_1.6.0
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

timescaledb:
  image: timescale/timescaledb:2.28.3-pg16
  storage: 10Gi
  # ingestion 6 x 10 + incident-api 10 + responder 5 + detector 5 + init-container probes, with headroom.
  maxConnections: 150
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
