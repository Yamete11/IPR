image:
  repository: smartcity/sensor-simulator
  tag: dev
  pullPolicy: IfNotPresent
global:
  imageTag: ""

# Off by default; `kubectl scale deploy/sensor-simulator --replicas=1` (or deploy/scripts/demo-hpa.*)
# starts the load. Each replica is an independent generator emitting the same sensor ids, so keep
# it at 1 unless you want deliberately colliding timestamps.
replicaCount: 0

# ~1000 sensors (CITY_EXTRA_SENSORS from the ConfigMap), one reading each every 100 ms: the load
# profile from the design plan, enough for the KEDA demo. Faults come from cascades only: every
# 5 minutes the next district's substation loses voltage and, 5 s later, the water pressure of its
# buildings drops, which the responder correlates over the graph into one planned incident plus
# linked ones. Random faults (--anomaly-prob > 0) would make every sensor fail within seconds and
# correlate unrelated faults with each other.
args:
  - "--interval"
  - "0.1"
  - "--anomaly-prob"
  - "0"
  - "--cascade-every"
  - "300"

configMapName: smartcity-config
waitImage: busybox:1.37
waitFor:
  - name: kafka
    host: smartcity-kafka-bootstrap
    port: 9092

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
