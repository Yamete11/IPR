spring:
  application:
    name: topology-service

  datasource:
    # AGE_HOST overrides POSTGRES_HOST when the two databases live on different hosts (Kubernetes);
    # AGE_PORT matches the host port docker-compose.yml publishes for age-db.
    url: jdbc:postgresql://${AGE_HOST:${POSTGRES_HOST:localhost}}:${AGE_PORT:5432}/${POSTGRES_DB:smartcity}
    username: ${POSTGRES_USER:smartcity}
    password: ${POSTGRES_PASSWORD:smartcity}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: topology-pool
      maximum-pool-size: 10
      connection-init-sql: 'SET search_path = ag_catalog, "$user", public'

  # Relational tables next to the graph (repair crews, see schema.sql / data.sql); idempotent.
  sql:
    init:
      mode: always

topology:
  # The AGE graph this service owns. Single source of truth for BOTH sides: SeedLoader writes it
  # and TopologyRepository reads it. The `graph` field in the seed file must match, or startup fails
  # (seeding one graph while querying another would silently return empty results).
  graph: city_topology
  # Startup seed loader (SeedLoader): populates the graph above from the seed file.
  seed:
    enabled: true
    location: classpath:seed/city-topology.json
    # After seeding, ensure a GIN index on each label's properties (id lookups become index probes).
    index-enabled: true

# Liveness/readiness probes for Kubernetes plus the Prometheus scrape endpoint. The readiness
# group includes the datasource(s) so a pod is not routed to while its database is unreachable.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

---
# Dev-only: expose the interactive GraphiQL console and the schema printer endpoint.
# Gated behind the `dev` profile so they are never enabled in other environments.
spring:
  config:
    activate:
      on-profile: dev
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true
